<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script map</title>
<style>
:root {
    --bg: #15171b;
    --panel: #1e2126;
    --text: #e6e8eb;
    --muted: #9aa0a9;
    --border: #363a42;
    --accent: #6ea8ec;
    --edge: #6b717b;
    --record: #c6cbd3;
    --unresolved: #5c6068;
    --high-bg: #3d1f1e;
    --high-border: #f0675f;
    --medium-bg: #3a3018;
    --medium-border: #e3ac3b;
    --low-bg: #1c3324;
    --low-border: #5cc27f;
    --badge-bg: #2a3242;
    --accent-contrast: #0f1115;
}
:root[data-theme="light"] {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1d1f23;
    --muted: #61666f;
    --border: #d8dbe0;
    --accent: #2b6cb0;
    --edge: #8a909a;
    --record: #3d4451;
    --unresolved: #a0a4ab;
    --high-bg: #fde2e1;
    --high-border: #d93a33;
    --medium-bg: #fdf1d6;
    --medium-border: #c98a0c;
    --low-bg: #e1f3e6;
    --low-border: #2f8a4e;
    --badge-bg: #e6ecf7;
    --accent-contrast: #ffffff;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
}
header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
}
header h1 { font-size: 18px; margin: 0; }
#generated { color: var(--muted); font-size: 12px; }
#refresh { display: inline-flex; align-items: center; gap: 8px; }
#refresh button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
}
#refresh button:disabled { cursor: default; opacity: 0.6; }
#refresh-status { color: var(--muted); font-size: 12px; }
#repo-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    background: var(--bg);
}
.chip.unverified { border-color: var(--medium-border); }
#repo-chips button.chip {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
}
#repo-chips button.chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.env-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    background: var(--bg);
}
.env-badge.warn {
    color: var(--text);
    background: var(--high-bg);
    border-color: var(--high-border);
}
.env-toggle {
    display: inline-flex;
    flex-wrap: wrap;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 12px;
}
.env-toggle > * { padding: 2px 10px; }
.env-toggle a { color: var(--accent); text-decoration: none; background: var(--panel); }
.env-toggle a:hover, .env-toggle a:focus { text-decoration: underline; }
.env-toggle .active { background: var(--accent); color: var(--accent-contrast); font-weight: 600; }
#theme-toggle, #script-search {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
}
#theme-toggle { cursor: pointer; }
.missing-repos { flex-basis: 100%; color: var(--muted); font-size: 12px; margin: 0; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button, .controls select, .controls button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
}
nav button, .controls button { cursor: pointer; }
nav button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
main { padding: 12px 16px; }
.view[hidden] { display: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.empty { color: var(--muted); font-style: italic; }
#i-tiles, #r-tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tile {
    flex: 0 1 140px;
    min-width: 110px;
    border: 1px solid var(--border);
    border-left-width: 5px;
    border-radius: 8px;
    background: var(--panel);
    padding: 6px 10px;
}
.tile.high { background: var(--high-bg); border-left-color: var(--high-border); }
.tile.medium { background: var(--medium-bg); border-left-color: var(--medium-border); }
.tile.low { background: var(--low-bg); border-left-color: var(--low-border); }
.tile.sel { outline: 2px solid var(--accent); }
button.tile { font: inherit; color: inherit; text-align: left; cursor: pointer; }
.tile .tile-label, .tile .tile-line { display: block; }
.tile .tile-label { color: var(--muted); font-size: 12px; }
.tile .tile-value { font-size: 20px; font-weight: 600; }
.tile .tile-pct { color: var(--muted); font-size: 12px; margin-left: 6px; }
.matrix-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    margin-bottom: 12px;
}
.matrix-wrap .empty { margin: 8px 12px; }
.matrix { border-collapse: collapse; width: 100%; }
.matrix th, .matrix td {
    border-bottom: 1px solid var(--border);
    padding: 4px 10px;
    text-align: right;
    white-space: nowrap;
}
.matrix th.row-label { text-align: left; }
.matrix tr.totals th, .matrix tr.totals td, .matrix .total { font-weight: 600; }
.matrix button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-align: inherit;
}
.matrix .short { font-weight: 600; margin-right: 6px; }
.matrix .full { color: var(--muted); }
.matrix td.v-high { background: var(--high-bg); box-shadow: inset 0 0 0 1px var(--high-border); }
.matrix td.v-medium { background: var(--medium-bg); box-shadow: inset 0 0 0 1px var(--medium-border); }
.matrix td.zero { color: var(--muted); }
.matrix .sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.matrix .in-sel { color: var(--accent); font-weight: 700; }
#i-list-heading, #rec-list-heading { font-size: 15px; margin: 0 0 8px; }
#i-list details, #rec-list details {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 6px 10px;
    margin-bottom: 6px;
}
#i-list details details, #rec-list details details {
    border: 0;
    border-radius: 0;
    background: none;
    padding: 0;
    margin: 4px 0 0;
}
#i-list a, #rec-list a { color: var(--accent); }
#i-list summary, #rec-list summary { cursor: pointer; }
#i-list .name, #rec-list .name { font-weight: 600; word-break: break-word; }
#i-list .path, #rec-list .path { display: block; margin-left: 0; }
#i-list dl, #rec-list dl { margin: 6px 0 0; }
#i-list dt, #rec-list dt { font-weight: 600; margin-top: 6px; }
#i-list dd, #rec-list dd { margin: 2px 0 0; word-break: break-word; }
#i-list dd ul, #rec-list dd ul { margin: 0; padding-left: 18px; }
.regen { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; }
.regen button {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-contrast);
    background: var(--accent);
    border: 1px solid var(--border);
    border-color: var(--accent);
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
}
.regen button:disabled { cursor: default; opacity: 0.6; }
.regen-status { color: var(--muted); font-size: 12px; }
.regen-panel {
    flex-basis: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    padding: 8px 10px;
}
.regen-panel select, .regen-panel input, .regen-panel textarea {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    max-width: 100%;
}
.regen-panel input[hidden] { display: none; }
.regen-panel textarea { width: 360px; min-height: 60px; }
.regen-panel .regen-help { color: var(--muted); font-size: 12px; margin: 0; overflow-wrap: anywhere; }
.regen-panel .regen-actions { display: flex; gap: 8px; }
.summary-history { margin-top: 4px; overflow-wrap: anywhere; word-break: break-word; }
.summary-history summary { color: var(--muted); font-size: 12px; cursor: pointer; }
.summary-history ol { margin: 4px 0 0; padding-left: 18px; }
.summary-history li { margin-bottom: 4px; }
.change-history { margin-top: 4px; overflow-wrap: anywhere; word-break: break-word; }
.change-history summary { color: var(--muted); font-size: 12px; cursor: pointer; }
.change-history ol { margin: 4px 0 0; padding-left: 18px; }
.change-history li { margin-bottom: 4px; }
.change-links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
#rec-missing { margin-bottom: 8px; }
#rec-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
}
.card.area { background: var(--panel); border-left-color: var(--accent); }
.card.area.sel { background: var(--badge-bg); outline: 2px solid var(--accent); outline-offset: -2px; }
#rec-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
#rec-chips .note { margin: 0; }
#rec-chips button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    cursor: pointer;
    text-align: left;
    word-break: break-word;
}
#rec-chips button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.kind { color: var(--muted); font-size: 12px; }
.note { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
.lane, .other {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 8px 12px;
    margin-bottom: 8px;
}
.lane h3, .other h3 { font-size: 14px; margin: 0 0 6px; }
.lane ul, .other ul, #rec-missing ul { margin: 0; padding-left: 18px; }
.badge {
    display: inline-block;
    font-size: 11px;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--badge-bg);
    margin-left: 6px;
}
.path { color: var(--muted); font-size: 12px; margin-left: 6px; word-break: break-all; }
#r-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.r-detail { grid-column: 1 / -1; }
.r-detail > details {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 6px 10px;
}
.r-detail a { color: var(--accent); }
.r-detail summary { cursor: pointer; }
.r-detail .name { font-weight: 600; word-break: break-word; }
.r-detail .path { display: block; margin-left: 0; }
.r-detail dl { margin: 6px 0 0; }
.r-detail dt { font-weight: 600; margin-top: 6px; }
.r-detail dd { margin: 2px 0 0; word-break: break-word; }
.r-detail dd ul { margin: 0; padding-left: 18px; }
.card {
    border: 1px solid var(--border);
    border-left-width: 5px;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
}
.card:focus { outline: 2px solid var(--accent); }
.card.high { background: var(--high-bg); border-left-color: var(--high-border); }
.card.medium { background: var(--medium-bg); border-left-color: var(--medium-border); }
.card.low { background: var(--low-bg); border-left-color: var(--low-border); }
.card .name { font-weight: 600; word-break: break-word; }
.card .meta { color: var(--muted); font-size: 12px; }
.card ul { margin: 4px 0 0; padding-left: 18px; font-size: 12px; }
.mark {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-left: 6px;
    color: var(--text);
}
.mark.mark-new { background: var(--low-bg); border-color: var(--low-border); }
.mark.mark-updated { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.mark.mark-removed { background: var(--high-bg); border-color: var(--high-border); }
.updated-dot { color: var(--accent); margin-left: 6px; font-size: 12px; }
#seen-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--badge-bg);
    padding: 6px 10px;
    margin-bottom: 8px;
    word-break: break-word;
}
#seen-banner button, #c-head .c-modes button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
}
#c-head .c-modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
#c-head .c-modes button:disabled { cursor: default; opacity: 0.6; }
#c-head h2 { font-size: 15px; margin: 0; }
#c-head .c-modes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
.c-day h3 { font-size: 14px; margin: 12px 0 6px; }
.c-change {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 6px 10px;
    margin-bottom: 6px;
    word-break: break-word;
}
.c-change a { color: var(--accent); }
.c-files { list-style: none; margin: 4px 0 0; padding: 0; }
.c-file { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; margin-top: 2px; word-break: break-word; }
.c-file .mark { margin-left: 0; }
.c-file .path { margin-left: 0; }
.c-file .c-name { font-weight: 600; word-break: break-word; }
.c-file button.c-name {
    font: inherit;
    font-weight: 600;
    color: var(--accent);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-align: left;
}
.c-detail { margin: 4px 0 6px; }
.c-detail > details {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    padding: 6px 10px;
}
.c-detail summary { cursor: pointer; }
.c-detail .name { font-weight: 600; word-break: break-word; }
.c-detail .path { display: block; margin-left: 0; }
.c-detail dl { margin: 6px 0 0; }
.c-detail dt { font-weight: 600; margin-top: 6px; }
.c-detail dd { margin: 2px 0 0; word-break: break-word; }
.c-detail dd ul { margin: 0; padding-left: 18px; }
.c-detail ul { list-style: disc; }
.c-detail ol { list-style: decimal; }
#skipped { margin: 16px; }
#skipped table { border-collapse: collapse; width: 100%; margin-top: 8px; }
#skipped th, #skipped td { border-bottom: 1px solid var(--border); padding: 4px 6px; text-align: left; word-break: break-all; }
@media (max-width: 600px) {
    header { flex-direction: column; align-items: flex-start; }
    nav { margin-left: 0; flex-wrap: wrap; }
    main { padding: 8px; }
    .controls { flex-direction: column; align-items: stretch; }
    #i-tiles, #r-tiles { flex-wrap: wrap; }
    .tile { flex: 1 1 100px; }
    .matrix-wrap { overflow-x: auto; max-width: 100%; }
    #skipped { margin: 8px; }
    #script-search { width: 100%; }
    .regen-panel select, .regen-panel input, .regen-panel textarea { width: 100%; box-sizing: border-box; }
}
</style>
</head>
<body>
<header>
    <h1 id="title">Script map</h1>
    <span id="generated"></span>
    <div id="repo-chips"></div>
    <nav>
        <button type="button" data-view="inventory">Inventory</button>
        <button type="button" data-view="records">Records</button>
        <button type="button" data-view="risk">Risk grid</button>
        <button type="button" data-view="changes">Changes</button>
    </nav>
</header>
<main>
    <div class="controls" id="i-controls">
        <input type="search" id="script-search" list="script-search-options" placeholder="Search scripts" aria-label="Search scripts" autocomplete="off">
        <datalist id="script-search-options"></datalist>
        <select id="i-repo" aria-label="Client filter"></select>
        <select id="i-type" aria-label="Script type filter"></select>
        <select id="i-version" aria-label="Version filter"></select>
        <select id="i-risk" aria-label="Risk filter">
            <option value="">All risk</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button type="button" id="i-clear">Clear all</button>
    </div>
    <section id="view-inventory" class="view">
        <div id="i-tiles"></div>
        <div class="matrix-wrap"><div id="i-matrix"></div></div>
        <h2 id="i-list-heading"></h2>
        <div id="i-list"></div>
    </section>
    <section id="view-records" class="view" hidden>
        <details id="rec-missing"><summary id="rec-missing-count"></summary><ul id="rec-missing-list"></ul></details>
        <div id="rec-cards"></div>
        <div id="rec-chips"></div>
        <h2 id="rec-list-heading" hidden></h2>
        <div id="rec-list"></div>
        <p class="note" id="rec-note" hidden>Order within a step follows deployment order in NetSuite, which isn't in the code.</p>
        <div id="rec-detail"></div>
    </section>
    <section id="view-risk" class="view" hidden>
        <div id="r-tiles"></div>
        <div id="r-grid"></div>
    </section>
    <section id="view-changes" class="view" hidden>
        <div id="c-head"></div>
        <div id="c-list"></div>
    </section>
</main>
<details id="skipped"><summary id="skipped-summary"></summary><div id="skipped-body"></div></details>
<script type="application/json" id="script-map-data">__SCRIPT_MAP_DATA__</script>
<script>
(function () {
    'use strict';

    var data = JSON.parse(document.getElementById('script-map-data').textContent);
    var linkOrigin = String(data.link_origin || '');
    var LANES = ['beforeLoad', 'beforeSubmit', 'afterSubmit', 'pageInit', 'fieldChanged',
        'postSourcing', 'sublistChanged', 'lineInit', 'validateField', 'validateLine',
        'validateInsert', 'validateDelete', 'saveRecord'];
    var TYPE_LABELS = [['UE', 'UserEventScript'], ['CS', 'ClientScript'], ['SL', 'Suitelet'],
        ['MR', 'MapReduceScript'], ['SS', 'ScheduledScript'], ['RL', 'Restlet'],
        ['PL', 'Portlet'], ['WA', 'WorkflowActionScript'], ['MU', 'MassUpdateScript']];
    var VERSIONS = ['1.0', '2.0', '2.x', '2.1', 'Other', 'None'];
    var BASE_VERSIONS = ['1.0', '2.0', '2.x', '2.1'];
    var RISK_LEVELS = ['high', 'medium', 'low'];
    var ALL = '';
    // One filter state shared by every view, mirrored in the URL hash.
    var state = { search: '', repo: ALL, type: ALL, version: ALL, risk: ALL };
    var currentView = 'inventory';

    var nodes = data.nodes || [];
    var edges = data.edges || [];
    var byId = {};
    var links = {};
    nodes.forEach(function (n) { byId[n.id] = n; links[n.id] = []; });
    edges.forEach(function (e) {
        if (!byId[e.source] || !byId[e.target]) { return; }
        links[e.source].push({ other: e.target, kind: e.kind, edge: e });
        links[e.target].push({ other: e.source, kind: e.kind, edge: e });
    });
    var scripts = nodes.filter(function (n) { return n.kind === 'script'; });
    var records = nodes.filter(function (n) { return n.kind === 'record'; });

    function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) { node.className = className; }
        if (text !== undefined && text !== null) { node.textContent = String(text); }
        return node;
    }

    function clear(node) {
        while (node.firstChild) { node.removeChild(node.firstChild); }
    }

    function inRepo(node, repo) { return repo === ALL || node.repo === repo; }

    function deployCount(script) {
        return links[script.id].filter(function (l) { return l.kind === 'deploy'; }).length;
    }

    function fillRepoSelect(select) {
        clear(select);
        var all = el('option', null, 'All clients');
        all.value = ALL;
        select.appendChild(all);
        (data.repos || []).forEach(function (r) {
            var opt = el('option', null, r.label);
            opt.value = r.label;
            select.appendChild(opt);
        });
    }

    // Header
    var title = data.title || 'Script map';
    document.title = title;
    var titleEl = document.getElementById('title');
    titleEl.textContent = title;
    var environment = String(data.environment || 'Production');
    var envBadge = el('span', 'env-badge' + (environment === 'Production' ? '' : ' warn'),
        environment.toUpperCase());
    titleEl.parentNode.insertBefore(envBadge, titleEl.nextSibling);
    if (environment !== 'Production') {
        document.title = title + ' (' + environment.toUpperCase() + ')';
    }
    var switchUrl = String(data.switch_url || '');
    if (switchUrl) {
        var switchLabel = String(data.switch_label || '');
        var envToggle = el('span', 'env-toggle');
        envToggle.setAttribute('role', 'navigation');
        envToggle.setAttribute('aria-label', 'Environment');
        var currentEnv = el('span', 'active', environment);

            var send = el('button', null, 'Send');
            send.type = 'button';
            var cancel = el('button', null, 'Cancel');
            cancel.type = 'button';
            actions.appendChild(send);
            actions.appendChild(cancel);
            panel.appendChild(who);
            panel.appendChild(other);
            panel.appendChild(guidance);
            panel.appendChild(el('p', 'regen-help', 'Regenerate runs a fresh summary for this ' +
                'script. Nightly runs and Refresh data only summarize new or changed scripts; ' +
                'they never redo existing summaries.'));
            panel.appendChild(actions);

            function authorName() {
                return who.value === OTHER_AUTHOR ? String(other.value || '').trim() : who.value;
            }
            function update() {
                other.hidden = who.value !== OTHER_AUTHOR;
                send.disabled = !authorName();
            }
            var remembered = readAuthor();
            if (remembered && team.indexOf(remembered) !== -1) {
                who.value = remembered;
            } else if (remembered) {
                who.value = OTHER_AUTHOR;
                other.value = remembered;
            } else {
                who.value = team.length ? team[0] : OTHER_AUTHOR;
            }
            update();
            who.addEventListener('change', update);
            other.addEventListener('input', update);
            cancel.addEventListener('click', closePanel);
            send.addEventListener('click', function () {
                var name = authorName();
                if (!name) { return; }
                var note = guidance.value.trim();
                writeAuthor(name);
                closePanel();
                send.disabled = true;
                button.disabled = true;
                status.textContent = '';
                post(name, note);
            });
            wrap.appendChild(panel);
        }
        button.addEventListener('click', function () {
            if (panel) {
                closePanel();
            } else {
                openPanel();
            }
        });
        function post(name, note) {
            fetch(refreshUrl, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ key: s.summary_key, author: name, guidance: note })
            }).then(function (res) {
                if (res.status === 202) {
                    status.textContent =
                        'Regeneration requested. New summary in about 10 minutes, then reload this page.';
                    return;
                }
                if (res.status !== 429) {
                    failed('Request failed (HTTP ' + res.status + ').');
                    return;
                }
                return res.json().then(function (body) {
                    var when = Date.parse(body && typeof body.requested_at === 'string' ?
                        body.requested_at : '');
                    if (isNaN(when)) {
                        failed('Request failed (network error).');
                        return;
                    }
                    failed('Already requested at ' + pacificStamp(when) + '. Try again after ' +
                        pacificStamp(when + 600000) + '.');
                }, function () {
                    failed('Request failed (network error).');
                });
            }).catch(function () {
                failed('Request failed (network error).');
            });
        }
        return wrap;
    }

    function stampSuffix(stamp) {
        stamp = typeof stamp === 'string' ? stamp : '';
        if (!stamp || isNaN(Date.parse(stamp))) { return ''; }
        return ' · generated ' + pacificStamp(stamp);
    }

    function generatedSuffix(s) { return stampSuffix(s.summary_generated_at); }

    var TRIGGER_LABELS = {
        first: 'first summary',
        code_changed: 'updated after code change',
        regenerate: 'regenerated',
        reused: 'copied from identical script'
    };

    function howPart(trigger, author) {
        if (typeof trigger !== 'string' ||
                !Object.prototype.hasOwnProperty.call(TRIGGER_LABELS, trigger)) {
            return '';
        }
        var label = TRIGGER_LABELS[trigger];
        var who = typeof author === 'string' ? author : '';
        if (trigger === 'regenerate' && who) { label += ' by ' + who; }
        return ' · ' + label;
    }

    function guidanceLine(guidance) {
        return el('div', 'kind', 'Guidance used: "' + guidance + '"');
    }

    function summaryHistory(history) {
        var box = el('details', 'summary-history');
        box.appendChild(el('summary', null, 'History (' + history.length + ')'));
        var list = el('ol');
        history.forEach(function (h) {
            var item = el('li');
            item.appendChild(el('div', null, typeof h.summary === 'string' ? h.summary : ''));
            var meta = howPart(h.trigger, h.author) + stampSuffix(h.generated_at);
            if (meta) { item.appendChild(el('div', 'kind', meta.slice(3))); }
            if (typeof h.guidance === 'string' && h.guidance) {
                item.appendChild(guidanceLine(h.guidance));
            }
            list.appendChild(item);
        });
        box.appendChild(list);
        return box;
    }

    var NEW_DAYS_MS = 14 * 86400000;
    var UPDATED_LABEL = 'Updated since your last visit';

    // Added within the last 14 days (and not more than a day in the future).
    function isNewScript(s) {
        var t = typeof s.added_at === 'string' ? Date.parse(s.added_at) : NaN;
        if (isNaN(t)) { return false; }
        var now = Date.now();
        return now - t <= NEW_DAYS_MS && t - now <= 86400000;
    }

    // The NEW badge and the "updated since your last visit" dot, after a script's name.
    function appendMarks(parent, s) {
        if (isNewScript(s)) { parent.appendChild(el('span', 'mark mark-new', 'NEW')); }
        if (laterThanSeen(s.last_commit_date)) {
            var dot = el('span', 'updated-dot', '●');
            dot.setAttribute('aria-label', UPDATED_LABEL);
            dot.setAttribute('title', UPDATED_LABEL);
            parent.appendChild(dot);
        }
    }

    function scriptEntry(s) {
        var details = el('details');
        details.setAttribute('data-id', s.id);
        var summary = el('summary');
        summary.appendChild(el('span', 'name', s.name));
        appendMarks(summary, s);
        summary.appendChild(el('span', 'kind', ' · ' + s.repo + ' · '));
        var type = el('span', null, shortType(s.type));
        type.setAttribute('title', s.type);
        summary.appendChild(type);
        if (s.type_inferred) { summary.appendChild(el('span', 'badge', 'inferred')); }
        summary.appendChild(el('span', 'kind', ' · ' + s.version + ' · ' + s.risk.level + ' risk'));
        summary.appendChild(el('span', 'path', s.path));
        details.appendChild(summary);
        var dl = el('dl');
        var about = el('span');
        if (s.summary_source === 'ai' || s.summary_source === 'header') {
            about.appendChild(document.createTextNode(s.summary || ''));
            about.appendChild(el('span', 'kind',
                s.summary_source === 'ai' ?
                    ' · AI summary' + howPart(s.summary_trigger, s.summary_author) +
                        generatedSuffix(s) :
                    ' · From header comment'));
        } else {
            about.appendChild(el('span', 'empty', 'No description'));
        }
        var summaryValue = about;
        if (s.summary_source === 'ai') {
            var history = Array.isArray(s.summary_history) ? s.summary_history.filter(function (h) {
                return h && typeof h === 'object';
            }) : [];
            var hasGuidance = typeof s.summary_guidance === 'string' && s.summary_guidance;
            if (hasGuidance || history.length) {
                summaryValue = el('div');
                summaryValue.appendChild(about);
                if (hasGuidance) { summaryValue.appendChild(guidanceLine(s.summary_guidance)); }
                if (history.length) { summaryValue.appendChild(summaryHistory(history)); }
            }
        }
        if (refreshUrl) {
            if (summaryValue === about) {
                summaryValue = el('div');
                summaryValue.appendChild(about);
            }
            summaryValue.appendChild(regenerateControl(s));
        }
        addField(dl, 'Summary', summaryValue);
        addField(dl, 'Last change', lastChange(s));
        addField(dl, 'Type', s.type + (s.type_inferred ? ' (inferred from folder)' : ''));
        addField(dl, 'Entry points', s.entry_points.length ? s.entry_points.join(', ') : 'none');
        addField(dl, 'N/ modules', s.modules.length ? s.modules.join(', ') : 'none');
        addField(dl, 'Records', recordList(s));
        addField(dl, 'Risk reasons', s.risk.reasons.length ? s.risk.reasons.join(', ') : 'none');
        details.appendChild(dl);
        return details;
    }

    function recordScripts(rec, kind) {
        return links[rec.id].filter(function (l) {
            return l.kind === kind && byId[l.other].kind === 'script';
        }).map(function (l) { return byId[l.other]; });
    }

    function areaRecords(repo) {
        var areas = Object.create(null);
        records.forEach(function (r) {
            if (!inRepo(r, repo)) { return; }
            var connected = links[r.id].filter(function (l) {
                return byId[l.other].kind === 'script' && matchesFilters(byId[l.other]);
            });
            if (!connected.length) { return; }
            var area = areas[r.category];
            if (!area) { area = areas[r.category] = { scripts: {}, groups: Object.create(null) }; }
            var group = area.groups[r.record_id];
            if (!group) {
                group = area.groups[r.record_id] = { id: r.record_id, label: null, nodes: [], scripts: {} };
            }
            group.nodes.push(r);
            if (group.label === null && r.label !== r.record_id) { group.label = r.label; }
            connected.forEach(function (l) {
                group.scripts[l.other] = true;
                area.scripts[l.other] = true;
            });
        });
        Object.keys(areas).forEach(function (name) {
            var groups = areas[name].groups;
            Object.keys(groups).forEach(function (id) {
                if (groups[id].label === null) { groups[id].label = id; }
            });
        });
        return areas;
    }

    function sortedGroups(area) {
        return Object.keys(area.groups).map(function (id) { return area.groups[id]; }).sort(function (a, b) {
            return Object.keys(b.scripts).length - Object.keys(a.scripts).length ||
                a.label.localeCompare(b.label) || a.id.localeCompare(b.id);
        });
    }

    function mergedScripts(group, kind) {
        var seen = {};
        var out = [];
        group.nodes.forEach(function (r) {
            recordScripts(r, kind).forEach(function (s) {
                if (!seen[s.id] && matchesFilters(s)) { seen[s.id] = true; out.push(s); }
            });
        });
        return out;
    }

    function recScriptItem(s) {
        var li = el('li');
        li.appendChild(document.createTextNode(s.name));
        var type = el('span', 'kind', ' · ' + s.repo + ' · ' + shortType(s.type) + ' · ' + s.version);
        type.setAttribute('title', s.type);
        li.appendChild(type);
        if (deployCount(s) >= 2) { li.appendChild(el('span', 'badge', 'shared')); }
        li.appendChild(el('span', 'path', s.path));
        return li;
    }

    function renderMissing() {
        var missing = scripts.filter(function (s) {
            return matchesFilters(s) && !s.has_deploy_line &&
                (s.type === 'UserEventScript' || s.type === 'ClientScript');
        });
        recMissingCount.textContent = missing.length +
            ' UserEventScript and ClientScript files have no DEPLOY ON: line';

        missing.forEach(function (s) {
            recMissingList.appendChild(el('li', null, s.repo + ': ' + s.path));
        });

    function selectArea(name) {
        recArea = recArea === name ? ALL : name;
        recRecord = ALL;
        renderRecords();
    }

    function selectRecord(id) {
        recRecord = id;
        renderRecords();
    }

    function renderAreaCards(areas, shown) {
        shown.forEach(function (name) {
            var area = areas[name];
            var card = el('div', 'card area' + (recArea === name ? ' sel' : ''));
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-pressed', recArea === name ? 'true' : 'false');
            card.appendChild(el('div', 'name', name));
            card.appendChild(el('div', 'meta', Object.keys(area.scripts).length + ' scripts'));
            card.appendChild(el('div', 'meta', Object.keys(area.groups).length + ' record types'));
            card.addEventListener('click', function () { selectArea(name); });
            card.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectArea(name); }
            });
            recCards.appendChild(card);
        });
    }

    function renderChips(groups) {
        function chip(text, id) {
            var btn = el('button', recRecord === id ? 'active' : null, text);
            btn.type = 'button';
            btn.setAttribute('aria-pressed', recRecord === id ? 'true' : 'false');
            btn.addEventListener('click', function () { selectRecord(id); });
            recChips.appendChild(btn);
        }
        chip('All ' + recArea, ALL);
        groups.forEach(function (g) {
            chip(g.label + (g.label !== g.id ? ' [' + g.id + ']' : '') + ' · ' +
                Object.keys(g.scripts).length, g.id);
        });
    }

    function renderAreaList(groups) {
        var seen = {};
        var list = [];
        var inArea = {};
        groups.forEach(function (g) {
            g.nodes.forEach(function (r) {
                links[r.id].forEach(function (l) {
                    var s = byId[l.other];
                    if (s.kind !== 'script' || !matchesFilters(s)) { return; }
                    if (!seen[s.id]) { seen[s.id] = true; list.push(s); inArea[s.id] = []; }
                    var text = g.label + ' (' + l.kind + ')';
                    if (inArea[s.id].indexOf(text) === -1) { inArea[s.id].push(text); }
                });
            });
        });
        list.sort(function (a, b) {
            return versionRank(a.version) - versionRank(b.version) ||
                a.repo.localeCompare(b.repo) || a.path.localeCompare(b.path);
        });
        recListHeading.hidden = false;
        recListHeading.textContent = list.length + ' scripts';
        if (!list.length) {
            recList.appendChild(el('p', 'empty', 'No scripts found'));
            return;
        }
        list.forEach(function (s) {
            var entry = scriptEntry(s);
            var ul = el('ul');
            inArea[s.id].forEach(function (text) { ul.appendChild(el('li', null, text)); });
            addField(entry.querySelector('dl'), 'In this area:', ul);
            recList.appendChild(entry);
        });
    }

    function renderRecordDetail(group) {
        recNote.hidden = false;
        var deployed = mergedScripts(group, 'deploy');
        var lanesShown = 0;
        LANES.forEach(function (lane) {
            var inLane = deployed.filter(function (s) { return s.entry_points.indexOf(lane) !== -1; });
            if (!inLane.length) { return; }
            lanesShown += 1;
            var box = el('div', 'lane');
            box.appendChild(el('h3', null, lane));
            var ul = el('ul');
            inLane.forEach(function (s) { ul.appendChild(recScriptItem(s)); });
            box.appendChild(ul);
            recDetail.appendChild(box);
        });
        if (!lanesShown) {
            recDetail.appendChild(el('p', 'empty', 'No deployed scripts export a record entry point.'));
        }
        var other = el('div', 'other');
        other.appendChild(el('h3', null, 'Other scripts that touch this record'));
        var touching = mergedScripts(group, 'touches');
        if (touching.length) {
            var ul = el('ul');
            touching.forEach(function (s) { ul.appendChild(recScriptItem(s)); });
            other.appendChild(ul);
        } else {
            other.appendChild(el('p', 'empty', 'none'));
        }
        recDetail.appendChild(other);
    }

    function renderRecords() {
        renderMissing();
        clear(recCards);
        clear(recChips);
        clear(recList);
        clear(recDetail);
        recListHeading.hidden = true;
        recListHeading.textContent = '';
        recNote.hidden = true;
        var areas = areaRecords(state.repo);
        var shown = (data.record_categories || []).filter(function (name) { return areas[name]; });
        if (recArea !== ALL && shown.indexOf(recArea) === -1) {
            recArea = ALL;
            recRecord = ALL;
        }
        if (recArea !== ALL && recRecord !== ALL && !areas[recArea].groups[recRecord]) {
            recRecord = ALL;
        }
        if (!shown.length) {
            recChips.appendChild(el('p', 'empty', 'No scripts found'));
            return;
        }
        renderAreaCards(areas, shown);
        if (recArea === ALL) {
            recChips.appendChild(el('p', 'note', 'Pick an area to see its record types and scripts.'));
            return;
        }
        var groups = sortedGroups(areas[recArea]);
        renderChips(groups);
        if (recRecord === ALL) {
            renderAreaList(groups);
        } else {
            renderRecordDetail(areas[recArea].groups[recRecord]);
        }
    }

    // Risk grid
    var rTiles = document.getElementById('r-tiles');
    var rGrid = document.getElementById('r-grid');
    var openRisk = null;

    function renderRiskTiles() {
        clear(rTiles);
        var list = scripts.filter(function (s) { return matchesFilters(s, ['risk']); });
        RISK_LEVELS.forEach(function (level) {
            var count = list.filter(function (s) { return s.risk.level === level; }).length;
            tile(rTiles, level.charAt(0).toUpperCase() + level.slice(1), count, null, level,
                state.risk === level, function () {
                    state.risk = state.risk === level ? ALL : level;
                    applyFilters();
                });
        });
    }

    function closeRiskDetail() {
        if (!openRisk) { return; }
        if (openRisk.detail.parentNode) { openRisk.detail.parentNode.removeChild(openRisk.detail); }
        openRisk.card.setAttribute('aria-expanded', 'false');
        openRisk = null;
    }

    // Show the script's full details right after its card; only one is open at a time.
    function toggleRiskDetail(card, s) {
        var wasOpen = openRisk !== null && openRisk.card === card;
        closeRiskDetail();
        if (wasOpen) { return; }
        var wrap = el('div', 'r-detail');
        var entry = scriptEntry(s);
        entry.open = true;
        wrap.appendChild(entry);

        card.setAttribute('aria-expanded', 'true');

    function renderRisk() {
        renderRiskTiles();
        clear(rGrid);
        openRisk = null;
        var list = scripts.filter(function (s) { return matchesFilters(s); });
        if (!list.length) {
            rGrid.appendChild(el('p', 'empty', 'No scripts found'));
            return;

        list.sort(function (a, b) {

                s.risk.level + ' (' + s.risk.score + ')'));

                s.risk.reasons.forEach(function (r) { ul.appendChild(el('li', null, r)); });

            card.appendChild(ul);

            card.addEventListener('keydown', function (ev) {

    function syncControls() {
        if (searchInput.value !== state.search) { searchInput.value = state.search; }
        iRepo.value = state.repo;
        iRisk.value = state.risk;
        renderRepoChips();
    }

    // Changes
    var cHead = document.getElementById('c-head');
    var cList = document.getElementById('c-list');
    var changesMode = 'all';
    var openChange = null;
    var FILE_MARKS = {
        added: ['mark-new', 'NEW'],
        modified: ['mark-updated', 'UPDATED'],
        removed: ['mark-removed', 'REMOVED']
    };

    // "Tue, Oct 13, 2026" for the Pacific date of an ISO string, the UTC "YYYY-MM-DD"
    // without Intl, or '' when it does not parse.
    function pacificDay(value) {
        var d = new Date(typeof value === 'string' ? value : '');
        if (isNaN(d.getTime())) { return ''; }
        try {
            return new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/Los_Angeles', weekday: 'short', month: 'short',
                day: 'numeric', year: 'numeric'
            }).format(d);
        } catch (e) {
            return d.toISOString().slice(0, 10);
        }
    }

    function changeFiles(change) {
        return (Array.isArray(change.files) ? change.files : []).filter(function (f) {
            return f && typeof f === 'object';
        });
    }

    // The script node a changed file names, or null (removed, or not on this page).
    function fileScript(f) {
        var id = textOf(f.id);
        if (!id || !Object.prototype.hasOwnProperty.call(byId, id)) { return null; }
        return byId[id].kind === 'script' ? byId[id] : null;
    }

    // A file with a script uses every shared filter; any other file only matches the
    // client and the search, and only while type, version and risk are unfiltered.
    function fileShown(change, f) {
        var s = fileScript(f);
        if (s) { return matchesFilters(s); }
        return inRepo({ repo: textOf(change.repo) }, state.repo) && state.type === ALL &&
            state.version === ALL && state.risk === ALL && matchesSearch({ name: textOf(f.name) });
    }

    function closeChangeDetail() {
        if (!openChange) { return; }
        if (openChange.detail.parentNode) {
            openChange.detail.parentNode.removeChild(openChange.detail);
        }
        openChange.button.setAttribute('aria-expanded', 'false');
        openChange = null;
    }

    // Show the script's full details right under its file row; only one is open at a time.
    function toggleChangeDetail(row, button, s) {
        var wasOpen = openChange !== null && openChange.row === row;
        closeChangeDetail();
        if (wasOpen) { return; }
        var wrap = el('li', 'c-detail');
        var entry = scriptEntry(s);
        entry.open = true;
        wrap.appendChild(entry);
        row.parentNode.insertBefore(wrap, row.nextSibling);
        button.setAttribute('aria-expanded', 'true');
        openChange = { row: row, button: button, detail: wrap };
    }

    function fileRow(f) {
        var row = el('li', 'c-file');
        var status = textOf(f.status);
        var mark = Object.prototype.hasOwnProperty.call(FILE_MARKS, status) ?
            FILE_MARKS[status] : FILE_MARKS.modified;
        row.appendChild(el('span', 'mark ' + mark[0], mark[1]));
        var s = fileScript(f);
        if (s) {
            var button = el('button', 'c-name', textOf(f.name));
            button.type = 'button';
            button.setAttribute('aria-expanded', 'false');
            button.addEventListener('click', function () { toggleChangeDetail(row, button, s); });
            row.appendChild(button);
        } else {
            row.appendChild(el('span', 'c-name', textOf(f.name)));
        }
        row.appendChild(el('span', 'path', textOf(f.path)));
        return row;
    }

    function changeItem(change, files) {
        var box = el('div', 'c-change');
        var parts = [];
        var stamp = changeStamp(change.date);
        if (stamp) { parts.push(stamp); }
        if (textOf(change.author)) { parts.push(change.author); }
        if (textOf(change.repo)) { parts.push(change.repo); }
        commitParts(parts, textOf(change.commit), change.commit_url, textOf(change.pr),
            change.pr_url);
        if (parts.length) { box.appendChild(joinedLine(parts)); }
        if (textOf(change.subject)) { box.appendChild(el('div', 'kind', change.subject)); }
        var list = el('ul', 'c-files');
        files.forEach(function (f) { list.appendChild(fileRow(f)); });
        box.appendChild(list);
        return box;
    }

    function countText(n) { return n + ' change' + (n === 1 ? '' : 's'); }

    function renderChangesHead(count) {
        clear(cHead);
        cHead.appendChild(el('h2', null, countText(count)));
        var since = changeStamp(data.changes_since);
        cHead.appendChild(el('div', 'kind', since ? 'Since ' + since : 'Last 30 days'));
        var modes = el('div', 'c-modes');
        [['all', 'All'], ['since', 'Since your last visit (' + unseen.length + ')']].forEach(
            function (m) {
                var button = el('button', null, m[1]);
                button.type = 'button';
                button.setAttribute('aria-pressed', changesMode === m[0] ? 'true' : 'false');
                if (m[0] === 'since' && !unseen.length) { button.disabled = true; }
                button.addEventListener('click', function () {
                    changesMode = m[0];
                    renderChanges();
                });
                modes.appendChild(button);
            });
        cHead.appendChild(modes);
    }

    function renderChanges() {
        clear(cList);
        openChange = null;
        var sinceMode = changesMode === 'since';
        var shown = [];
        changes.forEach(function (c) {
            if (sinceMode && !isUnseen(c)) { return; }
            var files = changeFiles(c).filter(function (f) { return fileShown(c, f); });
            if (files.length) { shown.push({ change: c, files: files }); }
        });
        renderChangesHead(shown.length);
        if (!shown.length) {
            cList.appendChild(el('p', 'empty', sinceMode ? 'No changes since your last visit.' :
                'No changes in the last 30 days.'));
            return;
        }
        var day = null;
        var group = null;
        shown.forEach(function (item) {
            var label = pacificDay(item.change.date) || 'Unknown date';
            if (group === null || label !== day) {
                day = label;
                group = el('div', 'c-day');
                group.appendChild(el('h3', null, label));
                cList.appendChild(group);
            }
            group.appendChild(changeItem(item.change, item.files));
        });
    }

    // "Since your last visit" banner, above the shared filter bar. It counts every unseen
    // change on the page, ignoring the filters.
    var banner = null;

    function authorText(list) {
        var names = [];
        list.forEach(function (c) {
            var a = textOf(c.author);
            if (a && names.indexOf(a) === -1) { names.push(a); }
        });
        if (names.length <= 1) { return names.join(''); }
        if (names.length <= 3) {
            return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
        }
        return names.slice(0, 3).join(', ') + ' and ' + (names.length - 3) + ' more';
    }

    function hideBanner() {
        if (banner && banner.parentNode) { banner.parentNode.removeChild(banner); }
        banner = null;
    }

    function markSeen() {
        var failed = false;
        if (!seenWritten) {
            seenWritten = true;
            failed = !writeSeen();
        }
        hideBanner();
        // The write failed: re-render so the dots and the Since count go away.
        if (failed) { renderAll(); }
    }

    function showBanner() {
        var controls = document.getElementById('i-controls');
        if (!unseen.length || seenWritten || !controls.parentNode) { return; }
        banner = el('div');
        banner.id = 'seen-banner';
        banner.setAttribute('role', 'status');
        var authors = authorText(unseen);
        banner.appendChild(el('span', null, countText(unseen.length) + ' since your last visit' +
            (authors ? ' by ' + authors : '')));
        var see = el('button', null, 'See changes');
        see.type = 'button';
        see.addEventListener('click', function () {
            changesMode = 'since';
            renderChanges();
            showView('changes');
        });
        var dismiss = el('button', null, 'Dismiss');
        dismiss.type = 'button';
        dismiss.addEventListener('click', markSeen);
        banner.appendChild(document.createTextNode(' · '));
        banner.appendChild(see);
        banner.appendChild(document.createTextNode(' · '));
        banner.appendChild(dismiss);
        controls.parentNode.insertBefore(banner, controls);
    }
    showBanner();

    function renderAll() {
        syncControls();
        renderInventory();
        renderRecords();
        renderRisk();
        renderChanges();
    }

    // Re-render every view after a filter change and mirror the state in the URL hash.
    function applyFilters() {
        renderAll();
        writeHash();
    }

    searchInput.addEventListener('input', function () {
        state.search = String(searchInput.value || '');
        applyFilters();
    });

    // URL hash: #view=..&client=..&type=..&version=..&risk=..&q=.. with defaults omitted.
    var HASH_KEYS = ['view', 'client', 'type', 'version', 'risk', 'q'];
    var MAX_QUERY = 100;

    function hasLocation() {
        return typeof window !== 'undefined' && !!window && !!window.location;
    }

    function buildHash() {
        var values = {
            view: currentView === 'inventory' ? '' : currentView,
            client: state.repo,
            type: state.type,
            version: state.version,
            risk: state.risk,
            q: state.search
        };
        var parts = [];
        HASH_KEYS.forEach(function (k) {
            if (values[k]) { parts.push(k + '=' + encodeURIComponent(values[k])); }
        });
        return parts.length ? '#' + parts.join('&') : '';
    }

    function updateSwitchLink() {
        if (switchUrl && otherEnv) { otherEnv.setAttribute('href', switchUrl + buildHash()); }
    }

    function writeHash() {
        updateSwitchLink();
        if (!hasLocation()) { return; }
        var next = buildHash();
        if (String(window.location.hash || '') === next) { return; }
        if (window.history && typeof window.history.replaceState === 'function') {
            window.history.replaceState(null, '', next);
        } else {
            window.location.hash = next;
        }
    }

    function parseHash(raw) {
        var out = Object.create(null);
        var text = String(raw || '');
        if (text.charAt(0) === '#') { text = text.slice(1); }
        if (!text) { return out; }
        text.split('&').forEach(function (pair) {
            var at = pair.indexOf('=');
            if (at < 1) { return; }
            var key;
            var value;
            try {
                key = decodeURIComponent(pair.slice(0, at));
                value = decodeURIComponent(pair.slice(at + 1));
            } catch (e) {
                // A malformed escape: this pair is ignored by design, the rest still applies.
                return;
            }
            out[key] = value;
        });
        return out;
    }

    function hashValue(values, key, valid) {
        return key in values && valid(values[key]) ? values[key] : null;
    }

    // Apply a hash to the state (missing or invalid values stay at their defaults), then render.
    function loadHash(raw) {
        var values = parseHash(raw);
        var repoLabels = (data.repos || []).map(function (r) { return r.label; });
        function oneOf(list) { return function (v) { return list.indexOf(v) !== -1; }; }
        var view = hashValue(values, 'view', function (v) {
            return Object.prototype.hasOwnProperty.call(views, v);
        });
        state.repo = hashValue(values, 'client', oneOf(repoLabels)) || ALL;
        state.type = hashValue(values, 'type', oneOf(distinct(scripts, 'type'))) || ALL;
        state.version = hashValue(values, 'version', oneOf(distinct(scripts, 'version'))) || ALL;
        state.risk = hashValue(values, 'risk', oneOf(RISK_LEVELS)) || ALL;
        state.search = hashValue(values, 'q', function (v) { return v.length <= MAX_QUERY; }) || '';
        renderAll();
        showView(view || 'inventory');
    }

    if (hasLocation() && typeof window.addEventListener === 'function') {
        window.addEventListener('hashchange', function () {
            var raw = String(window.location.hash || '');
            if (raw === buildHash()) { return; }
            loadHash(raw);
        });
    }

    // Skipped files
    var skipped = data.skipped || [];
    document.getElementById('skipped-summary').textContent = 'Skipped files (' + skipped.length + ')';
    var skippedBody = document.getElementById('skipped-body');
    if (!skipped.length) {
        skippedBody.appendChild(el('p', 'empty', 'No skipped files'));
    } else {
        var table = el('table');
        var head = el('tr');
        ['Repo', 'Path', 'Reason'].forEach(function (h) { head.appendChild(el('th', null, h)); });
        table.appendChild(head);
        skipped.forEach(function (row) {
            var tr = el('tr');
            tr.appendChild(el('td', null, row.repo));
            tr.appendChild(el('td', null, row.path));
            tr.appendChild(el('td', null, row.reason));
            table.appendChild(tr);
        });
        skippedBody.appendChild(table);
    }

    // Pending-request status: read once per load. Pending means requested after this
    // page was built (data.generated_at).
    function applyStatus(body) {
        var built = Date.parse(String(data.generated_at || ''));
        if (isNaN(built)) { return; }
        var rebuildAt = typeof body.rebuild_requested_at === 'string' ?
            Date.parse(body.rebuild_requested_at) : NaN;
        if (!isNaN(rebuildAt) && rebuildAt > built) {
            refreshStatus.textContent = 'Refresh requested at ' + pacificStamp(rebuildAt) +
                '. New data usually within 10 minutes; reload to check.';
        }
        var requests = body.requests;
        if (!requests || typeof requests !== 'object' || Array.isArray(requests)) { return; }
        Object.keys(requests).forEach(function (key) {
            var when = typeof requests[key] === 'string' ? Date.parse(requests[key]) : NaN;
            if (!isNaN(when) && when > built) { pendingRegen[key] = when; }
        });
        regenSpans.forEach(function (r) {
            if (Object.prototype.hasOwnProperty.call(pendingRegen, r.key) && !r.span.textContent) {
                r.span.textContent = regenPendingText(pendingRegen[r.key]);
            }
        });
    }

    function loadStatus() {
        function unavailable() {
            statusLoaded = true;
            regenSpans = [];
            refreshStatus.textContent = 'Status unavailable.';
        }
        var request;
        try {
            request = fetch(refreshUrl, { method: 'GET', cache: 'no-store' });
        } catch (err) {
            unavailable();
            return;
        }
        Promise.resolve(request).then(function (res) {
            if (!res || res.status !== 200) {
                unavailable();
                return;
            }
            return res.json().then(function (body) {
                if (!body || typeof body !== 'object' || Array.isArray(body)) {
                    unavailable();
                    return;
                }
                statusLoaded = true;
                applyStatus(body);
                regenSpans = [];
            }, unavailable);
        }, unavailable).catch(unavailable);
    }

    loadHash(hasLocation() ? window.location.hash : '');
    if (refreshUrl) { loadStatus(); }
}());
</script>
</body>
</html>
