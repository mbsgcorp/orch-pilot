<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script map</title>
<style>
:root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1d1f23;
    --muted: #61666f;
    --border: #d8dbe0;
    --accent: #2b6cb0;
    --edge: #8a909a;
    --record: #3d4451;
    --unresolved: #a0a4ab;
    --high-bg: #fde2e1;
    --high-border: #d93a33;
    --medium-bg: #fdf1d6;
    --medium-border: #c98a0c;
    --low-bg: #e1f3e6;
    --low-border: #2f8a4e;
    --badge-bg: #e6ecf7;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #15171b;
        --panel: #1e2126;
        --text: #e6e8eb;
        --muted: #9aa0a9;
        --border: #363a42;
        --accent: #6ea8ec;
        --edge: #6b717b;
        --record: #c6cbd3;
        --unresolved: #5c6068;
        --high-bg: #3d1f1e;
        --high-border: #f0675f;
        --medium-bg: #3a3018;
        --medium-border: #e3ac3b;
        --low-bg: #1c3324;
        --low-border: #5cc27f;
        --badge-bg: #2a3242;
    }
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
}
header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
}
header h1 { font-size: 18px; margin: 0; }
#generated { color: var(--muted); font-size: 12px; }
#refresh { display: inline-flex; align-items: center; gap: 8px; }
#refresh button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
}
#refresh button:disabled { cursor: default; opacity: 0.6; }
#refresh-status { color: var(--muted); font-size: 12px; }
#repo-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    background: var(--bg);
}
.chip.unverified { border-color: var(--medium-border); }
.env-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    background: var(--bg);
}
.env-badge.warn {
    color: var(--text);
    background: var(--high-bg);
    border-color: var(--high-border);
}
.env-toggle {
    display: inline-flex;
    flex-wrap: wrap;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 12px;
}
.env-toggle > * { padding: 2px 10px; }
.env-toggle a { color: var(--accent); text-decoration: none; background: var(--panel); }
.env-toggle a:hover, .env-toggle a:focus { text-decoration: underline; }
.env-toggle .active { background: var(--accent); color: #fff; font-weight: 600; }
.missing-repos { flex-basis: 100%; color: var(--muted); font-size: 12px; margin: 0; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button, .controls select, .controls button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
}
nav button, .controls button { cursor: pointer; }
nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
main { padding: 12px 16px; }
.view[hidden] { display: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.empty { color: var(--muted); font-style: italic; }
#i-tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tile {
    flex: 0 1 140px;
    min-width: 110px;
    border: 1px solid var(--border);
    border-left-width: 5px;
    border-radius: 8px;
    background: var(--panel);
    padding: 6px 10px;
}
.tile.high { background: var(--high-bg); border-left-color: var(--high-border); }
.tile.medium { background: var(--medium-bg); border-left-color: var(--medium-border); }
.tile .tile-label { color: var(--muted); font-size: 12px; }
.tile .tile-value { font-size: 20px; font-weight: 600; }
.tile .tile-pct { color: var(--muted); font-size: 12px; margin-left: 6px; }
.matrix-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    margin-bottom: 12px;
}
.matrix-wrap .empty { margin: 8px 12px; }
.matrix { border-collapse: collapse; width: 100%; }
.matrix th, .matrix td {
    border-bottom: 1px solid var(--border);
    padding: 4px 10px;
    text-align: right;
    white-space: nowrap;
}
.matrix th.row-label { text-align: left; }
.matrix tr.totals th, .matrix tr.totals td, .matrix .total { font-weight: 600; }
.matrix button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-align: inherit;
}
.matrix .short { font-weight: 600; margin-right: 6px; }
.matrix .full { color: var(--muted); }
.matrix td.v-high { background: var(--high-bg); box-shadow: inset 0 0 0 1px var(--high-border); }
.matrix td.v-medium { background: var(--medium-bg); box-shadow: inset 0 0 0 1px var(--medium-border); }
.matrix td.zero { color: var(--muted); }
.matrix .sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.matrix .in-sel { color: var(--accent); font-weight: 700; }
#i-list-heading, #rec-list-heading { font-size: 15px; margin: 0 0 8px; }
#i-list details, #rec-list details {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 6px 10px;
    margin-bottom: 6px;
}
#i-list summary, #rec-list summary { cursor: pointer; }
#i-list .name, #rec-list .name { font-weight: 600; word-break: break-word; }
#i-list .path, #rec-list .path { display: block; margin-left: 0; }
#i-list dl, #rec-list dl { margin: 6px 0 0; }
#i-list dt, #rec-list dt { font-weight: 600; margin-top: 6px; }
#i-list dd, #rec-list dd { margin: 2px 0 0; word-break: break-word; }
#i-list dd ul, #rec-list dd ul { margin: 0; padding-left: 18px; }
.regen { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; }
.regen button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
}
.regen button:disabled { cursor: default; opacity: 0.6; }
.regen-status { color: var(--muted); font-size: 12px; }
#rec-missing { margin-bottom: 8px; }
#rec-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
}
.card.area { background: var(--panel); border-left-color: var(--accent); }
.card.area.sel { background: var(--badge-bg); outline: 2px solid var(--accent); outline-offset: -2px; }
#rec-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
#rec-chips .note { margin: 0; }
#rec-chips button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    cursor: pointer;
    text-align: left;
    word-break: break-word;
}
#rec-chips button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.kind { color: var(--muted); font-size: 12px; }
.note { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
.lane, .other {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 8px 12px;
    margin-bottom: 8px;
}
.lane h3, .other h3 { font-size: 14px; margin: 0 0 6px; }
.lane ul, .other ul, #rec-missing ul { margin: 0; padding-left: 18px; }
.badge {
    display: inline-block;
    font-size: 11px;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--badge-bg);
    margin-left: 6px;
}
.path { color: var(--muted); font-size: 12px; margin-left: 6px; word-break: break-all; }
#r-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.card {
    border: 1px solid var(--border);
    border-left-width: 5px;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
}
.card:focus { outline: 2px solid var(--accent); }
.card.high { background: var(--high-bg); border-left-color: var(--high-border); }
.card.medium { background: var(--medium-bg); border-left-color: var(--medium-border); }
.card.low { background: var(--low-bg); border-left-color: var(--low-border); }
.card .name { font-weight: 600; word-break: break-word; }
.card .meta { color: var(--muted); font-size: 12px; }
.card ul { margin: 4px 0 0; padding-left: 18px; font-size: 12px; }
#skipped { margin: 16px; }
#skipped table { border-collapse: collapse; width: 100%; margin-top: 8px; }
#skipped th, #skipped td { border-bottom: 1px solid var(--border); padding: 4px 6px; text-align: left; word-break: break-all; }
@media (max-width: 600px) {
    header { flex-direction: column; align-items: flex-start; }
    nav { margin-left: 0; flex-wrap: wrap; }
    main { padding: 8px; }
    .controls { flex-direction: column; align-items: stretch; }
    #i-tiles { flex-wrap: wrap; }
    .tile { flex: 1 1 100px; }
    .matrix-wrap { overflow-x: auto; max-width: 100%; }
    #skipped { margin: 8px; }
}
</style>
</head>
<body>
<header>
    <h1 id="title">Script map</h1>
    <span id="generated"></span>
    <div id="repo-chips"></div>
    <nav>
        <button type="button" data-view="inventory">Inventory</button>
        <button type="button" data-view="records">Records</button>
        <button type="button" data-view="risk">Risk grid</button>
    </nav>
</header>
<main>
    <section id="view-inventory" class="view">
        <div class="controls">
            <select id="i-repo" aria-label="Client filter"></select>
            <select id="i-type" aria-label="Script type filter"></select>
            <select id="i-version" aria-label="Version filter"></select>
            <button type="button" id="i-clear">Clear filters</button>
        </div>
        <div id="i-tiles"></div>
        <div class="matrix-wrap"><div id="i-matrix"></div></div>
        <h2 id="i-list-heading"></h2>
        <div id="i-list"></div>
    </section>
    <section id="view-records" class="view" hidden>
        <div class="controls">
            <select id="rec-repo" aria-label="Client filter"></select>
        </div>
        <details id="rec-missing"><summary id="rec-missing-count"></summary><ul id="rec-missing-list"></ul></details>
        <div id="rec-cards"></div>
        <div id="rec-chips"></div>
        <h2 id="rec-list-heading" hidden></h2>
        <div id="rec-list"></div>
        <p class="note" id="rec-note" hidden>Order within a step follows deployment order in NetSuite, which isn't in the code.</p>
        <div id="rec-detail"></div>
    </section>
    <section id="view-risk" class="view" hidden>
        <div class="controls">
            <select id="r-repo" aria-label="Repo filter"></select>
        </div>
        <div id="r-grid"></div>
    </section>
</main>
<details id="skipped"><summary id="skipped-summary"></summary><div id="skipped-body"></div></details>
<script type="application/json" id="script-map-data">__SCRIPT_MAP_DATA__</script>
<script>
(function () {
    'use strict';

    var data = JSON.parse(document.getElementById('script-map-data').textContent);
    var LANES = ['beforeLoad', 'beforeSubmit', 'afterSubmit', 'pageInit', 'fieldChanged',
        'postSourcing', 'sublistChanged', 'lineInit', 'validateField', 'validateLine',
        'validateInsert', 'validateDelete', 'saveRecord'];
    var TYPE_LABELS = [['UE', 'UserEventScript'], ['CS', 'ClientScript'], ['SL', 'Suitelet'],
        ['MR', 'MapReduceScript'], ['SS', 'ScheduledScript'], ['RL', 'Restlet'],
        ['PL', 'Portlet'], ['WA', 'WorkflowActionScript'], ['MU', 'MassUpdateScript']];
    var VERSIONS = ['1.0', '2.0', '2.x', '2.1', 'Other', 'None'];
    var BASE_VERSIONS = ['1.0', '2.0', '2.x', '2.1'];
    var ALL = '';

    var nodes = data.nodes || [];
    var edges = data.edges || [];
    var byId = {};
    var links = {};
    nodes.forEach(function (n) { byId[n.id] = n; links[n.id] = []; });
    edges.forEach(function (e) {
        if (!byId[e.source] || !byId[e.target]) { return; }
        links[e.source].push({ other: e.target, kind: e.kind, edge: e });
        links[e.target].push({ other: e.source, kind: e.kind, edge: e });
    });
    var scripts = nodes.filter(function (n) { return n.kind === 'script'; });
    var records = nodes.filter(function (n) { return n.kind === 'record'; });

    function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) { node.className = className; }
        if (text !== undefined && text !== null) { node.textContent = String(text); }
        return node;
    }

    function clear(node) {
        while (node.firstChild) { node.removeChild(node.firstChild); }
    }

    function inRepo(node, repo) { return repo === ALL || node.repo === repo; }

    function deployCount(script) {
        return links[script.id].filter(function (l) { return l.kind === 'deploy'; }).length;
    }

    function fillRepoSelect(select) {
        clear(select);
        var all = el('option', null, 'All clients');
        all.value = ALL;
        select.appendChild(all);
        (data.repos || []).forEach(function (r) {
            var opt = el('option', null, r.label);
            opt.value = r.label;
            select.appendChild(opt);
        });
    }

    // Header
    var title = data.title || 'Script map';
    document.title = title;
    var titleEl = document.getElementById('title');
    titleEl.textContent = title;
    var environment = String(data.environment || 'Production');
    var envBadge = el('span', 'env-badge' + (environment === 'Production' ? '' : ' warn'),
        environment.toUpperCase());
    titleEl.parentNode.insertBefore(envBadge, titleEl.nextSibling);
    if (environment !== 'Production') {
        document.title = title + ' (' + environment.toUpperCase() + ')';
    }
    var switchUrl = String(data.switch_url || '');
    if (switchUrl) {
        var switchLabel = String(data.switch_label || '');
        var envToggle = el('span', 'env-toggle');
        envToggle.setAttribute('role', 'navigation');
        envToggle.setAttribute('aria-label', 'Environment');
        var currentEnv = el('span', 'active', environment);
        currentEnv.setAttribute('aria-current', 'page');
        var otherEnv = el('a', null, switchLabel);
        otherEnv.setAttribute('href', switchUrl);
        if (switchLabel === 'Production') {
            envToggle.appendChild(otherEnv);
            envToggle.appendChild(currentEnv);
        } else {
            envToggle.appendChild(currentEnv);
            envToggle.appendChild(otherEnv);
        }
        envBadge.parentNode.insertBefore(envToggle, envBadge.nextSibling);
    }
    function plural(n, unit) { return n + ' ' + unit + (n === 1 ? '' : 's') + ' ago'; }

    function relativeTime(ms) {
        if (ms < 60000) { return 'just now'; }
        if (ms < 3600000) { return plural(Math.floor(ms / 60000), 'minute'); }
        if (ms < 86400000) { return plural(Math.floor(ms / 3600000), 'hour'); }
        return plural(Math.floor(ms / 86400000), 'day');
    }

    var generatedEl = document.getElementById('generated');
    function updateGenerated() {
        var stamp = String(data.generated_at || '');
        var when = Date.parse(stamp);
        if (!stamp || isNaN(when)) {
            generatedEl.textContent = 'Last updated';
            return;
        }
        generatedEl.textContent = 'Last updated ' + relativeTime(Date.now() - when) + ' · ' +
            stamp.slice(0, 16).replace('T', ' ') + ' UTC';
    }
    updateGenerated();
    setInterval(updateGenerated, 60000);

    function hhmm(ms) {
        var d = new Date(ms);
        function pad(n) { return (n < 10 ? '0' : '') + n; }
        return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
    }

    var refreshUrl = String(data.refresh_url || '');
    if (refreshUrl) {
        var refreshWrap = el('span');
        refreshWrap.id = 'refresh';
        var refreshButton = el('button', null, 'Refresh data');
        refreshButton.type = 'button';
        var refreshStatus = el('span');
        refreshStatus.id = 'refresh-status';
        refreshStatus.setAttribute('role', 'status');
        refreshWrap.appendChild(refreshButton);
        refreshWrap.appendChild(refreshStatus);
        generatedEl.parentNode.insertBefore(refreshWrap, generatedEl.nextSibling);
        var refreshFailed = function (text) {
            refreshStatus.textContent = text;
            refreshButton.disabled = false;
        };
        refreshButton.addEventListener('click', function () {
            refreshButton.disabled = true;
            refreshStatus.textContent = '';
            fetch(refreshUrl, { method: 'POST' }).then(function (res) {
                if (res.status === 202) {
                    refreshStatus.textContent =
                        'Refresh requested. New data in about 10 minutes, then reload this page.';
                    return;
                }
                if (res.status !== 429) {
                    refreshFailed('Refresh failed (HTTP ' + res.status + ').');
                    return;
                }
                return res.json().then(function (body) {
                    var when = Date.parse(body && typeof body.requested_at === 'string' ?
                        body.requested_at : '');
                    if (isNaN(when)) {
                        refreshFailed('Refresh failed (HTTP 429).');
                        return;
                    }
                    refreshFailed('A refresh was already requested at ' + hhmm(when) +
                        ' UTC. Try again after ' + hhmm(when + 600000) + ' UTC.');
                }, function () {
                    refreshFailed('Refresh failed (network error).');
                });
            }).catch(function () {
                refreshFailed('Refresh failed (network error).');
            });
        });
    }
    var chips = document.getElementById('repo-chips');
    (data.repos || []).forEach(function (r) {
        var chip = el('span', 'chip' + (r.branch !== 'branch not verified' ? '' : ' unverified'),
            r.label + ' · ' + r.script_count + ' scripts · ' + r.branch);
        chips.appendChild(chip);
    });
    var missingRepos = Array.isArray(data.missing_repos) ? data.missing_repos : [];
    if (missingRepos.length) {
        var buildBranch = String(data.branch || 'main');
        chips.appendChild(el('p', 'missing-repos', 'Not included (no ' + buildBranch +
            ' branch): ' + missingRepos.map(String).join(', ')));
    }

    var views = { inventory: 'view-inventory', records: 'view-records', risk: 'view-risk' };
    var navButtons = document.querySelectorAll('nav button');
    function showView(name) {
        Object.keys(views).forEach(function (k) {
            document.getElementById(views[k]).hidden = k !== name;
        });
        Array.prototype.forEach.call(navButtons, function (b) {
            b.classList.toggle('active', b.getAttribute('data-view') === name);
        });
    }
    Array.prototype.forEach.call(navButtons, function (b) {
        b.addEventListener('click', function () { showView(b.getAttribute('data-view')); });
    });

    // Inventory
    var iRepo = document.getElementById('i-repo');
    var iType = document.getElementById('i-type');
    var iVersion = document.getElementById('i-version');
    var iClear = document.getElementById('i-clear');
    var iTiles = document.getElementById('i-tiles');
    var iMatrix = document.getElementById('i-matrix');
    var iListHeading = document.getElementById('i-list-heading');
    var iList = document.getElementById('i-list');
    var filter = { type: ALL, version: ALL };
    fillRepoSelect(iRepo);

    var shortLabels = {};
    TYPE_LABELS.forEach(function (pair, i) { shortLabels[pair[1]] = { label: pair[0], rank: i }; });

    function typeRank(t) {
        if (shortLabels[t]) { return shortLabels[t].rank; }
        if (t === 'Library') { return TYPE_LABELS.length + 1; }
        if (t === 'Unknown') { return TYPE_LABELS.length + 2; }
        return TYPE_LABELS.length;
    }

    function compareTypes(a, b) {
        return typeRank(a) - typeRank(b) || (a < b ? -1 : a > b ? 1 : 0);
    }

    function versionRank(v) {
        var i = VERSIONS.indexOf(v);
        return i === -1 ? VERSIONS.length : i;
    }

    function shortType(t) { return shortLabels[t] ? shortLabels[t].label : t; }

    function typeText(t) { return shortLabels[t] ? shortLabels[t].label + ' ' + t : t; }

    function distinct(list, key) {
        var out = [];
        list.forEach(function (s) { if (out.indexOf(s[key]) === -1) { out.push(s[key]); } });
        return out;
    }

    function fillFilter(select, allText, values, current, label) {
        clear(select);
        var all = el('option', null, allText);
        all.value = ALL;
        select.appendChild(all);
        values.forEach(function (v) {
            var opt = el('option', null, label ? label(v) : v);
            opt.value = v;
            select.appendChild(opt);
        });
        select.value = values.indexOf(current) !== -1 ? current : ALL;
        return select.value;
    }

    function clientScripts() {
        var repo = iRepo.value;
        return scripts.filter(function (s) { return inRepo(s, repo); });
    }

    function renderTiles(list) {
        clear(iTiles);
        var total = list.length;
        function tile(label, value, pct, tone) {
            var box = el('div', 'tile' + (tone ? ' ' + tone : ''));
            box.appendChild(el('div', 'tile-label', label));
            var line = el('div');
            line.appendChild(el('span', 'tile-value', value));
            if (pct !== null) { line.appendChild(el('span', 'tile-pct', pct + '%')); }
            box.appendChild(line);
            iTiles.appendChild(box);
        }
        tile('Total scripts', total, null, '');
        BASE_VERSIONS.forEach(function (v) {
            var count = list.filter(function (s) { return s.version === v; }).length;
            var pct = total ? Math.round(count * 100 / total) : 0;
            tile(v, count, pct, v === '1.0' ? 'high' : v === '2.0' ? 'medium' : '');
        });
    }

    function setFilter(type, version) {
        filter.type = type;
        filter.version = version;
        iType.value = type;
        iVersion.value = version;
        renderFiltered();
    }

    function renderMatrix(list) {
        clear(iMatrix);
        if (!list.length) {
            iMatrix.appendChild(el('p', 'empty', 'No scripts found'));
            return;
        }
        var rows = distinct(list, 'type').sort(compareTypes);
        var columns = BASE_VERSIONS.slice();
        ['Other', 'None'].forEach(function (v) {
            if (list.some(function (s) { return s.version === v; })) { columns.push(v); }
        });
        var counts = {};
        list.forEach(function (s) {
            var key = s.type + '\n' + s.version;
            counts[key] = (counts[key] || 0) + 1;
        });
        function count(t, v) { return counts[t + '\n' + v] || 0; }
        var typeOnly = filter.type !== ALL && filter.version === ALL;
        var versionOnly = filter.version !== ALL && filter.type === ALL;

        var table = el('table', 'matrix');
        var head = el('tr');
        head.appendChild(el('th', 'row-label', 'Type'));
        columns.forEach(function (v) {
            var th = el('th', versionOnly && filter.version === v ? 'sel' : null);
            var btn = el('button', null, v);
            btn.type = 'button';
            btn.setAttribute('title', 'Show all ' + v + ' scripts');
            btn.addEventListener('click', function () { setFilter(ALL, v); });
            th.appendChild(btn);
            head.appendChild(th);
        });
        head.appendChild(el('th', 'total', 'Total'));
        table.appendChild(head);

        rows.forEach(function (t) {
            var tr = el('tr');
            var th = el('th', 'row-label' + (typeOnly && filter.type === t ? ' sel' : ''));
            var btn = el('button');
            btn.type = 'button';
            if (shortLabels[t]) { btn.appendChild(el('span', 'short', shortLabels[t].label)); }
            btn.appendChild(el('span', shortLabels[t] ? 'full' : null, t));
            btn.addEventListener('click', function () { setFilter(t, ALL); });
            th.appendChild(btn);
            tr.appendChild(th);
            var rowTotal = 0;
            columns.forEach(function (v) {
                var n = count(t, v);
                rowTotal += n;
                if (!n) {
                    tr.appendChild(el('td', 'zero', '–'));
                    return;
                }
                var cls = v === '1.0' ? 'v-high' : v === '2.0' ? 'v-medium' : '';
                if (filter.type === t && filter.version === v) {
                    cls += ' sel';
                } else if ((typeOnly && filter.type === t) || (versionOnly && filter.version === v)) {
                    cls += ' in-sel';
                }
                var td = el('td', cls);
                var cell = el('button', null, n);
                cell.type = 'button';
                cell.setAttribute('title', t + ' · ' + v);
                cell.addEventListener('click', function () {
                    if (filter.type === t && filter.version === v) {
                        setFilter(ALL, ALL);
                    } else {
                        setFilter(t, v);
                    }
                });
                td.appendChild(cell);
                tr.appendChild(td);
            });
            tr.appendChild(el('td', 'total', rowTotal));
            table.appendChild(tr);
        });

        var totals = el('tr', 'totals');
        totals.appendChild(el('th', 'row-label', 'Total'));
        columns.forEach(function (v) {
            totals.appendChild(el('td', null,
                list.filter(function (s) { return s.version === v; }).length));
        });
        totals.appendChild(el('td', null, list.length));
        table.appendChild(totals);
        iMatrix.appendChild(table);
    }

    function addField(dl, label, value) {
        dl.appendChild(el('dt', null, label));
        var dd = el('dd');
        if (value instanceof Node) { dd.appendChild(value); } else { dd.textContent = value; }
        dl.appendChild(dd);
    }

    function recordList(s) {
        var items = links[s.id].filter(function (l) { return byId[l.other].kind === 'record'; });
        if (!items.length) { return el('span', 'empty', 'none'); }
        var ul = el('ul');
        items.forEach(function (l) {
            var li = el('li', null, byId[l.other].label);
            li.appendChild(el('span', 'kind', ' ' + l.kind));
            ul.appendChild(li);
        });
        return ul;
    }

    function regenerateControl(s) {
        var wrap = el('div', 'regen');
        var button = el('button', null, 'Regenerate summary');
        button.type = 'button';
        var status = el('span', 'regen-status');
        status.setAttribute('role', 'status');
        wrap.appendChild(button);
        wrap.appendChild(status);
        function failed(text) {
            status.textContent = text;
            button.disabled = false;
        }
        button.addEventListener('click', function () {
            button.disabled = true;
            status.textContent = '';
            fetch(refreshUrl, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ key: s.summary_key })
            }).then(function (res) {
                if (res.status === 202) {
                    status.textContent =
                        'Regeneration requested. New summary in about 10 minutes, then reload this page.';
                    return;
                }
                if (res.status !== 429) {
                    failed('Request failed (HTTP ' + res.status + ').');
                    return;
                }
                return res.json().then(function (body) {
                    var when = Date.parse(body && typeof body.requested_at === 'string' ?
                        body.requested_at : '');
                    if (isNaN(when)) {
                        failed('Request failed (network error).');
                        return;
                    }
                    failed('Already requested at ' + hhmm(when) + ' UTC. Try again after ' +
                        hhmm(when + 600000) + ' UTC.');
                }, function () {
                    failed('Request failed (network error).');
                });
            }).catch(function () {
                failed('Request failed (network error).');
            });
        });
        return wrap;
    }

    function scriptEntry(s) {
        var details = el('details');
        details.setAttribute('data-id', s.id);
        var summary = el('summary');
        summary.appendChild(el('span', 'name', s.name));
        summary.appendChild(el('span', 'kind', ' · ' + s.repo + ' · '));
        var type = el('span', null, shortType(s.type));
        type.setAttribute('title', s.type);
        summary.appendChild(type);
        if (s.type_inferred) { summary.appendChild(el('span', 'badge', 'inferred')); }
        summary.appendChild(el('span', 'kind', ' · ' + s.version + ' · ' + s.risk.level + ' risk'));
        summary.appendChild(el('span', 'path', s.path));
        details.appendChild(summary);
        var dl = el('dl');
        var about = el('span');
        if (s.summary_source === 'ai' || s.summary_source === 'header') {
            about.appendChild(document.createTextNode(s.summary || ''));
            about.appendChild(el('span', 'kind',
                s.summary_source === 'ai' ? ' · AI summary' : ' · From header comment'));
        } else {
            about.appendChild(el('span', 'empty', 'No description'));
        }
        var summaryValue = about;
        if (refreshUrl) {
            summaryValue = el('div');
            summaryValue.appendChild(about);
            summaryValue.appendChild(regenerateControl(s));
        }
        addField(dl, 'Summary', summaryValue);
        addField(dl, 'Type', s.type + (s.type_inferred ? ' (inferred from folder)' : ''));
        addField(dl, 'Entry points', s.entry_points.length ? s.entry_points.join(', ') : 'none');
        addField(dl, 'N/ modules', s.modules.length ? s.modules.join(', ') : 'none');
        addField(dl, 'Records', recordList(s));
        addField(dl, 'Risk reasons', s.risk.reasons.length ? s.risk.reasons.join(', ') : 'none');
        details.appendChild(dl);
        return details;
    }

    function renderList(list) {
        clear(iList);
        var shown = list.filter(function (s) {
            return (filter.type === ALL || s.type === filter.type) &&
                (filter.version === ALL || s.version === filter.version);
        });
        shown.sort(function (a, b) {
            return versionRank(a.version) - versionRank(b.version) ||
                a.repo.localeCompare(b.repo) || a.path.localeCompare(b.path);
        });
        iListHeading.textContent = shown.length + ' scripts';
        if (!shown.length) {
            iList.appendChild(el('p', 'empty', 'No scripts found'));
            return;
        }
        shown.forEach(function (s) { iList.appendChild(scriptEntry(s)); });
    }

    function renderFiltered() {
        var list = clientScripts();
        renderMatrix(list);
        renderList(list);
    }

    function renderInventory() {
        var list = clientScripts();
        filter.type = fillFilter(iType, 'All types', distinct(list, 'type').sort(compareTypes),
            filter.type, typeText);
        filter.version = fillFilter(iVersion, 'All versions',
            distinct(list, 'version').sort(function (a, b) { return versionRank(a) - versionRank(b); }),
            filter.version);
        renderTiles(list);
        renderMatrix(list);
        renderList(list);
    }

    iRepo.addEventListener('change', renderInventory);
    iType.addEventListener('change', function () { setFilter(iType.value, filter.version); });
    iVersion.addEventListener('change', function () { setFilter(filter.type, iVersion.value); });
    iClear.addEventListener('click', function () { setFilter(ALL, ALL); });

    // Records
    var recRepo = document.getElementById('rec-repo');
    var recCards = document.getElementById('rec-cards');
    var recChips = document.getElementById('rec-chips');
    var recListHeading = document.getElementById('rec-list-heading');
    var recList = document.getElementById('rec-list');
    var recNote = document.getElementById('rec-note');
    var recDetail = document.getElementById('rec-detail');
    var recMissingCount = document.getElementById('rec-missing-count');
    var recMissingList = document.getElementById('rec-missing-list');
    var recArea = ALL;
    var recRecord = ALL;
    fillRepoSelect(recRepo);

    function recordScripts(rec, kind) {
        return links[rec.id].filter(function (l) {
            return l.kind === kind && byId[l.other].kind === 'script';
        }).map(function (l) { return byId[l.other]; });
    }

    function areaRecords(repo) {
        var areas = Object.create(null);
        records.forEach(function (r) {
            if (!inRepo(r, repo)) { return; }
            var connected = links[r.id].filter(function (l) { return byId[l.other].kind === 'script'; });
            if (!connected.length) { return; }
            var area = areas[r.category];
            if (!area) { area = areas[r.category] = { scripts: {}, groups: Object.create(null) }; }
            var group = area.groups[r.record_id];
            if (!group) {
                group = area.groups[r.record_id] = { id: r.record_id, label: null, nodes: [], scripts: {} };
            }
            group.nodes.push(r);
            if (group.label === null && r.label !== r.record_id) { group.label = r.label; }
            connected.forEach(function (l) {
                group.scripts[l.other] = true;
                area.scripts[l.other] = true;
            });
        });
        Object.keys(areas).forEach(function (name) {
            var groups = areas[name].groups;
            Object.keys(groups).forEach(function (id) {
                if (groups[id].label === null) { groups[id].label = id; }
            });
        });
        return areas;
    }

    function sortedGroups(area) {
        return Object.keys(area.groups).map(function (id) { return area.groups[id]; }).sort(function (a, b) {
            return Object.keys(b.scripts).length - Object.keys(a.scripts).length ||
                a.label.localeCompare(b.label) || a.id.localeCompare(b.id);
        });
    }

    function mergedScripts(group, kind) {
        var seen = {};
        var out = [];
        group.nodes.forEach(function (r) {
            recordScripts(r, kind).forEach(function (s) {
                if (!seen[s.id]) { seen[s.id] = true; out.push(s); }
            });
        });
        return out;
    }

    function recScriptItem(s) {
        var li = el('li');
        li.appendChild(document.createTextNode(s.name));
        var type = el('span', 'kind', ' · ' + s.repo + ' · ' + shortType(s.type) + ' · ' + s.version);
        type.setAttribute('title', s.type);
        li.appendChild(type);
        if (deployCount(s) >= 2) { li.appendChild(el('span', 'badge', 'shared')); }
        li.appendChild(el('span', 'path', s.path));
        return li;
    }

    function renderMissing() {
        var repo = recRepo.value;
        var missing = scripts.filter(function (s) {
            return inRepo(s, repo) && !s.has_deploy_line &&
                (s.type === 'UserEventScript' || s.type === 'ClientScript');
        });
        recMissingCount.textContent = missing.length +
            ' UserEventScript and ClientScript files have no DEPLOY ON: line';
        clear(recMissingList);
        missing.forEach(function (s) {
            recMissingList.appendChild(el('li', null, s.repo + ': ' + s.path));
        });
    }

    function selectArea(name) {
        recArea = recArea === name ? ALL : name;
        recRecord = ALL;
        renderRecords();
    }

    function selectRecord(id) {
        recRecord = id;
        renderRecords();
    }

    function renderAreaCards(areas, shown) {
        shown.forEach(function (name) {
            var area = areas[name];
            var card = el('div', 'card area' + (recArea === name ? ' sel' : ''));
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-pressed', recArea === name ? 'true' : 'false');
            card.appendChild(el('div', 'name', name));
            card.appendChild(el('div', 'meta', Object.keys(area.scripts).length + ' scripts'));
            card.appendChild(el('div', 'meta', Object.keys(area.groups).length + ' record types'));
            card.addEventListener('click', function () { selectArea(name); });
            card.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectArea(name); }
            });
            recCards.appendChild(card);
        });
    }

    function renderChips(groups) {
        function chip(text, id) {
            var btn = el('button', recRecord === id ? 'active' : null, text);
            btn.type = 'button';
            btn.setAttribute('aria-pressed', recRecord === id ? 'true' : 'false');
            btn.addEventListener('click', function () { selectRecord(id); });
            recChips.appendChild(btn);
        }
        chip('All ' + recArea, ALL);
        groups.forEach(function (g) {
            chip(g.label + (g.label !== g.id ? ' [' + g.id + ']' : '') + ' · ' +
                Object.keys(g.scripts).length, g.id);
        });
    }

    function renderAreaList(groups) {
        var seen = {};
        var list = [];
        var inArea = {};
        groups.forEach(function (g) {
            g.nodes.forEach(function (r) {
                links[r.id].forEach(function (l) {
                    var s = byId[l.other];
                    if (s.kind !== 'script') { return; }
                    if (!seen[s.id]) { seen[s.id] = true; list.push(s); inArea[s.id] = []; }
                    var text = g.label + ' (' + l.kind + ')';
                    if (inArea[s.id].indexOf(text) === -1) { inArea[s.id].push(text); }
                });
            });
        });
        list.sort(function (a, b) {
            return versionRank(a.version) - versionRank(b.version) ||
                a.repo.localeCompare(b.repo) || a.path.localeCompare(b.path);
        });
        recListHeading.hidden = false;
        recListHeading.textContent = list.length + ' scripts';
        if (!list.length) {
            recList.appendChild(el('p', 'empty', 'No scripts found'));
            return;
        }
        list.forEach(function (s) {
            var entry = scriptEntry(s);
            var ul = el('ul');
            inArea[s.id].forEach(function (text) { ul.appendChild(el('li', null, text)); });
            addField(entry.querySelector('dl'), 'In this area:', ul);
            recList.appendChild(entry);
        });
    }

    function renderRecordDetail(group) {
        recNote.hidden = false;
        var deployed = mergedScripts(group, 'deploy');
        var lanesShown = 0;
        LANES.forEach(function (lane) {
            var inLane = deployed.filter(function (s) { return s.entry_points.indexOf(lane) !== -1; });
            if (!inLane.length) { return; }
            lanesShown += 1;
            var box = el('div', 'lane');
            box.appendChild(el('h3', null, lane));
            var ul = el('ul');
            inLane.forEach(function (s) { ul.appendChild(recScriptItem(s)); });
            box.appendChild(ul);
            recDetail.appendChild(box);
        });
        if (!lanesShown) {
            recDetail.appendChild(el('p', 'empty', 'No deployed scripts export a record entry point.'));
        }
        var other = el('div', 'other');
        other.appendChild(el('h3', null, 'Other scripts that touch this record'));
        var touching = mergedScripts(group, 'touches');
        if (touching.length) {
            var ul = el('ul');
            touching.forEach(function (s) { ul.appendChild(recScriptItem(s)); });
            other.appendChild(ul);
        } else {
            other.appendChild(el('p', 'empty', 'none'));
        }
        recDetail.appendChild(other);
    }

    function renderRecords() {
        renderMissing();
        clear(recCards);
        clear(recChips);
        clear(recList);
        clear(recDetail);
        recListHeading.hidden = true;
        recListHeading.textContent = '';
        recNote.hidden = true;
        var areas = areaRecords(recRepo.value);
        var shown = (data.record_categories || []).filter(function (name) { return areas[name]; });
        if (recArea !== ALL && shown.indexOf(recArea) === -1) {
            recArea = ALL;
            recRecord = ALL;
        }
        if (recArea !== ALL && recRecord !== ALL && !areas[recArea].groups[recRecord]) {
            recRecord = ALL;
        }
        if (!shown.length) {
            recChips.appendChild(el('p', 'empty', 'No scripts found'));
            return;
        }
        renderAreaCards(areas, shown);
        if (recArea === ALL) {
            recChips.appendChild(el('p', 'note', 'Pick an area to see its record types and scripts.'));
            return;
        }
        var groups = sortedGroups(areas[recArea]);
        renderChips(groups);
        if (recRecord === ALL) {
            renderAreaList(groups);
        } else {
            renderRecordDetail(areas[recArea].groups[recRecord]);
        }
    }

    recRepo.addEventListener('change', renderRecords);

    // Risk grid
    var rRepo = document.getElementById('r-repo');
    var rGrid = document.getElementById('r-grid');
    fillRepoSelect(rRepo);

    function openInInventory(s) {
        iRepo.value = s.repo;
        filter.type = s.type;
        filter.version = s.version;
        showView('inventory');
        renderInventory();
        var entries = iList.querySelectorAll('details');
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].getAttribute('data-id') === s.id) {
                entries[i].open = true;
                entries[i].scrollIntoView();
                break;
            }
        }
    }

    function renderRisk() {
        clear(rGrid);
        var repo = rRepo.value;
        var list = scripts.filter(function (s) { return inRepo(s, repo); });
        if (!list.length) {
            rGrid.appendChild(el('p', 'empty', 'No scripts found'));
            return;
        }
        list.sort(function (a, b) {
            return b.risk.score - a.risk.score || a.path.localeCompare(b.path) ||
                a.repo.localeCompare(b.repo);
        });
        list.forEach(function (s) {
            var card = el('div', 'card ' + s.risk.level);
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.appendChild(el('div', 'name', s.name));
            card.appendChild(el('div', 'meta', s.repo + ' · ' + s.type + ' · ' +
                s.risk.level + ' (' + s.risk.score + ')'));
            var ul = el('ul');
            if (s.risk.reasons.length) {
                s.risk.reasons.forEach(function (r) { ul.appendChild(el('li', null, r)); });
            } else {
                ul.appendChild(el('li', null, 'no risk factors'));
            }
            card.appendChild(ul);
            card.addEventListener('click', function () { openInInventory(s); });
            card.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openInInventory(s); }
            });
            rGrid.appendChild(card);
        });
    }
    rRepo.addEventListener('change', renderRisk);

    // Skipped files
    var skipped = data.skipped || [];
    document.getElementById('skipped-summary').textContent = 'Skipped files (' + skipped.length + ')';
    var skippedBody = document.getElementById('skipped-body');
    if (!skipped.length) {
        skippedBody.appendChild(el('p', 'empty', 'No skipped files'));
    } else {
        var table = el('table');
        var head = el('tr');
        ['Repo', 'Path', 'Reason'].forEach(function (h) { head.appendChild(el('th', null, h)); });
        table.appendChild(head);
        skipped.forEach(function (row) {
            var tr = el('tr');
            tr.appendChild(el('td', null, row.repo));
            tr.appendChild(el('td', null, row.path));
            tr.appendChild(el('td', null, row.reason));
            table.appendChild(tr);
        });
        skippedBody.appendChild(table);
    }

    showView('inventory');
    renderInventory();
    renderRecords();
    renderRisk();
}());
</script>
</body>
</html>
